# /etc/nginx/http.d/kumo.conf
#
# LAN hits :8096 for the static SPA and /api (uvicorn on 127.0.0.1:8000).
# Media: FastAPI answers /api/videos/<id>/stream with X-Accel-Redirect: /_agent/<file id>,
# nginx then streams it from the host agent over the tap with the token injected.
# Python never touches video bytes, Range requests pass straight through.

upstream kumo_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream kumo_agent {
    include /etc/nginx/kumo/agent-upstream.conf;   # server 100.64.1.2:9090;  (written by kumo-setup-token)
    keepalive 4;
}

# Posters and subtitles are tiny and hit on every library view: cache them on the VM disk.
proxy_cache_path /var/cache/nginx/kumo levels=1:2 keys_zone=kumo_media:4m max_size=512m inactive=30d use_temp_path=off;

server {
    listen 8096 default_server;
    listen [::]:8096 default_server;
    server_name _;

    root /opt/kumo/web;
    index index.html;
    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://kumo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;        # /api/fetch waits on YouTube
    }

    # X-Accel-Redirect targets, reachable only from within nginx.
    location /_agent/ {
        internal;
        proxy_pass http://kumo_agent/v1/files/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host kumo-agent;
        include /etc/nginx/kumo/agent-auth.conf;     # written by kumo-setup-token
        proxy_set_header Cookie "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;             # stream through without buffering to disk or RAM
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /_agent_cached/ {
        internal;
        proxy_pass http://kumo_agent/v1/files/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host kumo-agent;
        include /etc/nginx/kumo/agent-auth.conf;
        proxy_set_header Cookie "";
        proxy_cache kumo_media;
        proxy_cache_key $uri;            # file ids are immutable
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }
}
